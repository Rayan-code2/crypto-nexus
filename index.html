
<!DOCTYPE html>
<html lang="en">
  <head>

    <title>CryptoNexus MLM - Elite Matrix System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#06b6d4',
              secondary: '#a855f7',
              dark: '#0f172a',
              darker: '#020617',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              glow: {
                'from': { 'box-shadow': '0 0 10px #06b6d455' },
                'to': { 'box-shadow': '0 0 20px #06b6d4aa' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Fallback CSS in case Tailwind CDN is slow */
      :root {
        --primary: #06b6d4;
        --secondary: #a855f7;
        --darker: #020617;
      }
      body {
        background-color: #020617 !important;
        color: #f8fafc;
        margin: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glass {
        background: rgba(15, 23, 42, 0.6) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
      }
      .neon-border {
        border: 1px solid rgba(6, 182, 212, 0.3) !important;
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
      }
      .bg-darker { background-color: #020617 !important; }
      .text-primary { color: #06b6d4 !important; }
      .text-secondary { color: #a855f7 !important; }
      
      /* Smooth transitions */
      * { transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.2s ease; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #020617; }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 10px;
      }
      
      /* Fix for input defaults */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: white;
        -webkit-box-shadow: 0 0 0px 1000px #0f172a inset;
        transition: background-color 5000s ease-in-out 0s;
      }
    </style>
